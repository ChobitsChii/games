<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Magic Aura Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#glow)"/>

  <!-- Stylized Crypt Key / Daggers Symbol -->
  <g filter="url(#shadow)">
    <!-- Crossed Dagger 1 -->
    <path d="M 32 96 L 60 68 L 68 76 L 40 104 Z" fill="#64748b"/>
    <path d="M 60 68 L 92 36 L 96 40 L 68 76 Z" fill="url(#blade)"/>
    <polygon points="92,36 96,40 104,24" fill="#67e8f9"/>
    
    <!-- Crossed Dagger 2 -->
    <path d="M 96 96 L 68 68 L 60 76 L 88 104 Z" fill="#64748b"/>
    <path d="M 68 68 L 36 36 L 32 40 L 60 76 Z" fill="url(#blade)"/>
    <polygon points="36,36 32,40 24,24" fill="#67e8f9"/>

    <!-- Keyhole / Center Gem -->
    <circle cx="64" cy="64" r="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M 62 64 L 66 64 L 67 71 L 61 71 Z" fill="#2dd4bf"/>
  </g>
</svg>

<!-- Mini-Games Slide-Down Topbar (Auto-Hide) -->
<style>
	#game-topbar {
		position: fixed;
		top: 0;
		left: 0;
		right: 0;
		z-index: 999999;
		transform: translateY(-100%);
		transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
		pointer-events: none;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
		user-select: none;
		-webkit-user-select: none;
	}

	/* Sichtbar bei Hover oder wenn mobil/per Klick geöffnet */
	#game-topbar.is-open,
	#game-topbar:hover {
		transform: translateY(0);
	}

	.topbar-content {
		pointer-events: auto;
		height: 44px;
		background: rgba(10, 12, 20, 0.9);
		backdrop-filter: blur(16px);
		-webkit-backdrop-filter: blur(16px);
		border-bottom: 1px solid rgba(255, 255, 255, 0.12);
		box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 0 1.25rem;
		color: #f1f5f9;
		box-sizing: border-box;
	}

	/* Unsichtbare Trigger-Zone am oberen Fensterrand */
	.topbar-trigger-zone {
		position: absolute;
		top: 100%;
		left: 0;
		right: 0;
		height: 18px;
		pointer-events: auto;
	}

	/* Stylischer Tab / Griff oben mittig */
	.topbar-tab {
		pointer-events: auto;
		position: absolute;
		top: 100%;
		left: 50%;
		transform: translateX(-50%);
		background: rgba(10, 12, 20, 0.75);
		backdrop-filter: blur(8px);
		-webkit-backdrop-filter: blur(8px);
		border: 1px solid rgba(255, 255, 255, 0.12);
		border-top: none;
		border-radius: 0 0 12px 12px;
		padding: 3px 16px 5px;
		color: rgba(255, 255, 255, 0.7);
		cursor: pointer;
		display: flex;
		align-items: center;
		gap: 6px;
		font-size: 11px;
		font-weight: 600;
		letter-spacing: 0.03em;
		box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
		transition: all 0.2s ease;
	}

	.topbar-tab:hover {
		background: rgba(18, 24, 40, 0.95);
		color: #38bdf8;
		border-color: rgba(56, 189, 248, 0.35);
		box-shadow: 0 4px 18px rgba(56, 189, 248, 0.25);
	}

	#game-topbar.is-open .topbar-tab,
	#game-topbar:hover .topbar-tab {
		opacity: 0;
		pointer-events: none;
	}

	/* Buttons & Elemente */
	.topbar-back-btn {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		color: #f8fafc;
		text-decoration: none;
		font-size: 13px;
		font-weight: 600;
		padding: 5px 12px;
		border-radius: 8px;
		background: rgba(255, 255, 255, 0.08);
		border: 1px solid rgba(255, 255, 255, 0.12);
		transition: all 0.2s ease;
	}

	.topbar-back-btn:hover {
		background: rgba(255, 255, 255, 0.18);
		border-color: rgba(255, 255, 255, 0.25);
		transform: translateX(-2px);
		color: #ffffff;
	}

	.topbar-title {
		display: flex;
		align-items: center;
		gap: 8px;
		font-size: 14px;
		font-weight: 700;
		letter-spacing: -0.01em;
	}

	.topbar-badge {
		font-family: monospace;
		font-size: 11px;
		font-weight: 600;
		padding: 2px 6px;
		border-radius: 5px;
		background: rgba(56, 189, 248, 0.15);
		color: #38bdf8;
		border: 1px solid rgba(56, 189, 248, 0.3);
	}

	.topbar-actions {
		display: flex;
		align-items: center;
		gap: 8px;
	}

	.topbar-btn {
		background: rgba(255, 255, 255, 0.06);
		border: 1px solid rgba(255, 255, 255, 0.12);
		color: #cbd5e1;
		border-radius: 8px;
		width: 32px;
		height: 32px;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		transition: all 0.2s ease;
	}

	.topbar-btn:hover {
		background: rgba(255, 255, 255, 0.15);
		color: #ffffff;
	}
</style>

<div id="game-topbar">
	<div class="topbar-content">
		<a href="../" class="topbar-back-btn" title="Zurück zur Spiele-Übersicht">
			<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
			<span>Spiele-Übersicht</span>
		</a>
		<div class="topbar-title">
			<span>%%GAME_NAME%%</span>
			<span class="topbar-badge">%%GAME_VERSION%%</span>
		</div>
		<div class="topbar-actions">
			<button id="topbar-fs-toggle" class="topbar-btn" title="Vollbild umschalten" type="button">
				<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
			</button>
		</div>
	</div>
	<div class="topbar-trigger-zone"></div>
	<div class="topbar-tab" id="topbar-tab-handle" title="Menüleiste einblenden">
		<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
		<span>Menü</span>
	</div>
</div>

<script>
(function() {
	var bar = document.getElementById('game-topbar');
	var tab = document.getElementById('topbar-tab-handle');
	var fsBtn = document.getElementById('topbar-fs-toggle');

	if (tab && bar) {
		tab.addEventListener('click', function(e) {
			e.stopPropagation();
			bar.classList.toggle('is-open');
		});
	}

	if (fsBtn) {
		fsBtn.addEventListener('click', function() {
			if (!document.fullscreenElement) {
				document.documentElement.requestFullscreen().catch(function() {});
			} else {
				document.exitFullscreen().catch(function() {});
			}
		});
	}

	document.addEventListener('click', function(e) {
		if (bar && bar.classList.contains('is-open') && !bar.contains(e.target)) {
			bar.classList.remove('is-open');
		}
	});
})();
</script>

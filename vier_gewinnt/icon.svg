<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#243b55" />
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="100%" stop-color="#184b9c" />
    </linearGradient>
    <linearGradient id="redDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c" />
      <stop offset="100%" stop-color="#c70039" />
    </linearGradient>
    <linearGradient id="yellowDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd152" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect x="14" y="24" width="100" height="84" rx="12" fill="url(#board)" filter="url(#shadow)"/>
  <!-- Row 1 -->
  <circle cx="35" cy="44" r="12" fill="url(#redDisc)"/>
  <circle cx="64" cy="44" r="12" fill="url(#yellowDisc)"/>
  <circle cx="93" cy="44" r="12" fill="#16294a"/>
  <!-- Row 2 -->
  <circle cx="35" cy="74" r="12" fill="url(#yellowDisc)"/>
  <circle cx="64" cy="74" r="12" fill="url(#redDisc)"/>
  <circle cx="93" cy="74" r="12" fill="url(#redDisc)"/>
  <!-- Subtle slot rims -->
  <circle cx="35" cy="44" r="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="64" cy="44" r="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="93" cy="44" r="12" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="35" cy="74" r="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="64" cy="74" r="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="93" cy="74" r="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
</svg>

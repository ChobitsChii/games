<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#spaceBg)" stroke="#00e5ff" stroke-width="3" />
  <!-- Asteroid -->
  <polygon points="32,36 48,24 74,30 84,48 78,72 56,80 34,68 26,50" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="44" cy="42" r="4" fill="#0f172a" />
  <circle cx="64" cy="56" r="6" fill="#0f172a" />
  <circle cx="42" cy="62" r="3" fill="#0f172a" />
  <!-- Raumschiff mit Glow -->
  <g filter="url(#glow)">
    <polygon points="64,32 94,92 64,80 34,92" fill="#0369a1" stroke="#38bdf8" stroke-width="3" />
    <polygon points="64,44 82,84 64,76 46,84" fill="#0284c7" />
    <circle cx="64" cy="62" r="5" fill="#38bdf8" />
    <!-- Triebwerksflamme -->
    <polygon points="56,85 64,106 72,85 64,90" fill="#f97316" />
    <polygon points="59,86 64,100 69,86 64,89" fill="#facc15" />
  </g>
</svg>

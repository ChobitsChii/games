<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#0f224a" />
      <stop offset="55%" stop-color="#071128" />
      <stop offset="100%" stop-color="#040712" />
    </radialGradient>
    <radialGradient id="shipAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="thrusterHalo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.72" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hullLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hullRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="asteroidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Vollflächiger Weltraum-Hintergrund (nahtlos für Adaptive-Icon-Masken) -->
  <rect width="512" height="512" fill="url(#spaceBg)" />

  <!-- Scharfe Sterne -->
  <circle cx="118" cy="140" r="3" fill="#bae6fd" opacity="0.75" />
  <circle cx="388" cy="132" r="4" fill="#e0f2fe" opacity="0.85" />
  <circle cx="408" cy="240" r="2.5" fill="#7dd3fc" opacity="0.65" />
  <circle cx="112" cy="316" r="3.5" fill="#e0f2fe" opacity="0.7" />
  <circle cx="378" cy="356" r="3" fill="#bae6fd" opacity="0.7" />
  <circle cx="152" cy="384" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="332" cy="108" r="2.5" fill="#7dd3fc" opacity="0.6" />

  <!-- Weicher radialer Neon-Nebel hinter dem Schiff (ohne SVG-Blur-Filter) -->
  <circle cx="256" cy="256" r="190" fill="url(#shipAura)" />

  <!-- Facettierter Asteroid in der sicheren Innenzone -->
  <g>
    <polygon points="122,158 178,108 274,126 312,188 292,272 214,300 134,262 106,204"
             fill="url(#asteroidGrad)" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" />
    <polygon points="178,108 274,126 232,190 154,182" fill="#334155" opacity="0.7" />
    <polygon points="232,190 312,188 292,272 214,300" fill="#0f172a" opacity="0.55" />
    <circle cx="166" cy="176" r="14" fill="#0f172a" stroke="#475569" stroke-width="2.5" />
    <circle cx="242" cy="222" r="20" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <circle cx="162" cy="242" r="10" fill="#0f172a" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Triebwerks-Aura -->
  <ellipse cx="256" cy="358" rx="54" ry="64" fill="url(#thrusterHalo)" />

  <!-- Triebwerksflamme (gestaffelte scharfe Polygone) -->
  <polygon points="222,318 256,412 290,318 256,336" fill="#f97316" />
  <polygon points="232,320 256,390 280,320 256,334" fill="#facc15" />
  <polygon points="242,322 256,368 270,322 256,332" fill="#fef9c3" />

  <!-- Subtiler Cyan-Vektor-Glow-Layer hinter dem Raumschiff -->
  <polygon points="256,116 376,348 256,304 136,348" fill="#0ea5e9" opacity="0.28" />

  <!-- Raumschiff (rasiermesserscharfe Vektor-Geometrie) -->
  <polygon points="256,126 364,338 256,298 148,338" fill="#0369a1" stroke="#38bdf8" stroke-width="9" stroke-linejoin="round" />
  <!-- Linke & Rechte Flügel-Facette für Tiefenwirkung -->
  <polygon points="256,136 256,294 156,332" fill="url(#hullLeft)" opacity="0.88" />
  <polygon points="256,136 356,332 256,294" fill="url(#hullRight)" opacity="0.92" />
  <!-- Innere Flügel-Kontur -->
  <polygon points="256,174 316,308 256,282 196,308" fill="#0284c7" stroke="#7dd3fc" stroke-width="4" stroke-linejoin="round" />
  <!-- Mittelgrat & Cockpit -->
  <line x1="256" y1="138" x2="256" y2="294" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <polygon points="256,204 274,244 256,262 238,244" fill="#bae6fd" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <circle cx="256" cy="238" r="7" fill="#ffffff" />
</svg>
